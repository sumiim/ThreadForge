services:
  api:
    build:
      context: .
      dockerfile: api-server/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - THREADFORGE_DOCKER=1
      - THREADFORGE_HOST=0.0.0.0
      - THREADFORGE_PORT=8000
      - THREADFORGE_DATA_DIR=/data
      - THREADFORGE_WORKSPACES_FILE=/config/workspaces.json
      - THREADFORGE_WEB_ORIGIN=http://127.0.0.1:5173
      - THREADFORGE_DESKTOP_ORIGIN_ENABLED=${THREADFORGE_DESKTOP_ORIGIN_ENABLED:-false}
      - THREADFORGE_OPENAPI_ENABLED=false
      - THREADFORGE_IDENTITY_MODE=${THREADFORGE_IDENTITY_MODE:-single_owner_instance}
      - THREADFORGE_GITHUB_OAUTH_CLIENT_ID=${THREADFORGE_GITHUB_OAUTH_CLIENT_ID:-}
      - THREADFORGE_GITHUB_OAUTH_CLIENT_SECRET=${THREADFORGE_GITHUB_OAUTH_CLIENT_SECRET:-}
      - THREADFORGE_GITHUB_OAUTH_CALLBACK_URL=${THREADFORGE_GITHUB_OAUTH_CALLBACK_URL:-http://127.0.0.1:18000/api/v1/auth/github/callback}
      - THREADFORGE_GITHUB_OAUTH_RETURN_URL=${THREADFORGE_GITHUB_OAUTH_RETURN_URL:-http://127.0.0.1:5173/}
      - THREADFORGE_GITHUB_OWNER_LOGIN=${THREADFORGE_GITHUB_OWNER_LOGIN:-}
      - THREADFORGE_GITHUB_ALLOWED_LOGINS=${THREADFORGE_GITHUB_ALLOWED_LOGINS:-[]}
      - THREADFORGE_AUTH_SESSION_TTL_SECONDS=${THREADFORGE_AUTH_SESSION_TTL_SECONDS:-604800}
      - THREADFORGE_AUTH_COOKIE_SECURE=${THREADFORGE_AUTH_COOKIE_SECURE:-false}
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=/workspace/threadforge
      - PICO_OPENAI_API_BASE=${PICO_OPENAI_API_BASE:-https://www.right.codes/codex/v1}
      - PICO_OPENAI_API_KEY=${PICO_OPENAI_API_KEY:-}
      - PICO_OPENAI_MODEL=${PICO_OPENAI_MODEL:-gpt-5.4}
    volumes:
      - threadforge-data:/data
      - ./api-server/workspaces.docker.json:/config/workspaces.json:ro
      - ./:/workspace/threadforge
    stop_grace_period: 130s
    user: threadforge:threadforge

volumes:
  threadforge-data:
