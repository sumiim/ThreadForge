[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threadforge-worker"
version = "0.2.7"
description = "ThreadForge local execution Worker"
requires-python = ">=3.10"
dependencies = [
  "pico==0.1.0",
  "pywin32>=306; sys_platform == 'win32'",
  "websockets>=14,<17",
  "cryptography>=43,<46",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "build>=1.0",
]

[project.scripts]
threadforge-worker = "threadforge_worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
ignore = ["BLE001", "S101", "S110", "S112"]

# Install pico first from ../pico-legacy-runtime.
