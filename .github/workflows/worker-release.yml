name: Worker Release

on:
  push:
    tags:
      - "worker-v*"

permissions:
  contents: read

jobs:
  release:
    name: Build, verify and publish Windows Worker
    runs-on: windows-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate tag and package version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^worker-v', ''
          $packageVersion = python -c "import tomllib; print(tomllib.load(open('local-worker/pyproject.toml','rb'))['project']['version'])"
          if ($tag -ne "worker-v$version" -or $version -ne $packageVersion) {
            throw "Tag $tag does not match Worker version $packageVersion"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install build tooling
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build cryptography pyinstaller
          python -m pip install -e ./pico-legacy-runtime -e "./local-worker[dev]"
          choco install nsis --no-progress -y

      - name: Test Worker
        shell: pwsh
        run: |
          python -m ruff check local-worker/src local-worker/tests
          python -m pytest -q local-worker/tests
          python -m build --wheel ./pico-legacy-runtime
          python -m build --wheel ./local-worker

      - name: Build self-contained Worker executable
        shell: pwsh
        run: |
          ./scripts/build-worker-installer.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Smoke test standalone installer
        shell: pwsh
        run: |
          $installer = (Resolve-Path "threadforge-worker-windows-x86_64.exe").Path
          $process = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Worker installer exited with $($process.ExitCode)"
          }
          $upgrade = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) {
            throw "Worker upgrade exited with $($upgrade.ExitCode)"
          }
          $worker = Join-Path $env:LOCALAPPDATA "ThreadForge\WorkerApp\threadforge-worker.exe"
          $service = Join-Path $env:LOCALAPPDATA "ThreadForge\WorkerApp\threadforge-worker-service.exe"
          if (-not (Test-Path -LiteralPath $worker)) {
            throw "Worker executable was not installed"
          }
          if (-not (Test-Path -LiteralPath $service)) {
            throw "Worker service executable was not installed"
          }
          & $worker --help
          if ($LASTEXITCODE -ne 0) { throw "Installed Worker CLI failed" }
          & $worker status
          if ($LASTEXITCODE -ne 0) { throw "Installed Worker status failed" }
          $serviceProcess = Start-Process -FilePath $service -ArgumentList "service" -PassThru
          if (-not $serviceProcess.WaitForExit(10000)) {
            Stop-Process -Id $serviceProcess.Id -Force
            throw "Unpaired Worker service did not exit"
          }
          if ($serviceProcess.ExitCode -ne 0) { throw "Unpaired Worker service failed" }

      - name: Sign release manifest
        shell: pwsh
        env:
          WORKER_RELEASE_SIGNING_KEY_B64: ${{ secrets.WORKER_RELEASE_SIGNING_KEY_B64 }}
        run: |
          if (-not $env:WORKER_RELEASE_SIGNING_KEY_B64) {
            throw "WORKER_RELEASE_SIGNING_KEY_B64 is not configured"
          }
          python scripts/build-worker-release.py `
            --version "${{ steps.version.outputs.version }}" `
            --tag "$env:GITHUB_REF_NAME" `
            --artifact threadforge-worker-windows-x86_64.exe `
            --output worker-manifest.json

      - name: Package ephemeral deployment payload
        shell: pwsh
        run: |
          Compress-Archive `
            -LiteralPath threadforge-worker-windows-x86_64.exe, worker-manifest.json `
            -DestinationPath worker-release.zip

      - name: Publish directly to ThreadForge server
        shell: pwsh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CD_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.CD_KNOWN_HOSTS }}
          CD_HOST: ${{ secrets.CD_HOST }}
          CD_PORT: ${{ secrets.CD_PORT }}
          CD_USER: ${{ secrets.CD_USER }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in "SSH_PRIVATE_KEY", "KNOWN_HOSTS", "CD_HOST", "CD_PORT", "CD_USER") {
            if (-not (Get-Item "Env:$name").Value) { throw "$name is not configured" }
          }
          $sshDir = Join-Path $env:USERPROFILE ".ssh"
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $keyPath = Join-Path $sshDir "threadforge_cd"
          [IO.File]::WriteAllText($keyPath, "$env:SSH_PRIVATE_KEY`n", $utf8)
          [IO.File]::WriteAllText((Join-Path $sshDir "known_hosts"), "$env:KNOWN_HOSTS`n", $utf8)
          icacls $keyPath /inheritance:r /grant:r "${env:USERNAME}:(R)" | Out-Null
          $payload = [Convert]::ToBase64String([IO.File]::ReadAllBytes("worker-release.zip"))
          $payload | ssh `
            -i $keyPath `
            -o BatchMode=yes `
            -o ConnectTimeout=20 `
            -o IdentitiesOnly=yes `
            -o StrictHostKeyChecking=yes `
            -p $env:CD_PORT `
            "$env:CD_USER@$env:CD_HOST" `
            "publish-worker $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw "Worker publish failed" }

      - name: Remove deployment payload and key
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue worker-release.zip
          Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:USERPROFILE ".ssh\threadforge_cd")
