name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "bootstrap/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-runtime:
    name: Legacy runtime (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pico-legacy-runtime/pyproject.toml
            agent-orchestrator/pyproject.toml

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./pico-legacy-runtime
          python -m pip install -e ./agent-orchestrator
          python -m pip install pytest

      - name: Check dependencies
        run: python -m pip check

      - name: Run tests
        working-directory: pico-legacy-runtime
        run: python -m pytest -q

  api-server:
    name: API server (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pico-legacy-runtime/pyproject.toml
            api-server/pyproject.toml

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./pico-legacy-runtime
          python -m pip install -e "./api-server[dev]"

      - name: Lint
        working-directory: api-server
        run: python -m ruff check src tests

      - name: Test
        working-directory: api-server
        run: python -m pytest -q

      - name: Build wheel
        run: python -m build --wheel ./api-server

  local-worker:
    name: Local Worker (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pico-legacy-runtime/pyproject.toml
            local-worker/pyproject.toml

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./pico-legacy-runtime
          python -m pip install -e "./local-worker[dev]"

      - name: Check dependencies
        run: python -m pip check

      - name: Lint
        working-directory: local-worker
        run: python -m ruff check src tests

      - name: Test
        working-directory: local-worker
        run: python -m pytest -q

      - name: Build wheel
        run: python -m build --wheel ./local-worker

  client:
    name: Client (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: client
        run: pnpm typecheck

      - name: Lint
        working-directory: client
        run: pnpm lint

      - name: Test
        working-directory: client
        run: pnpm test

      - name: Build
        working-directory: client
        run: pnpm build

  build:
    name: Build Python packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [legacy-runtime, api-server, local-worker, client]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build legacy runtime
        run: python -m build --wheel ./pico-legacy-runtime

      - name: Build agent orchestrator
        run: python -m build --wheel ./agent-orchestrator

      - name: Build API server
        run: python -m build --wheel ./api-server

      - name: Build local Worker
        run: python -m build --wheel ./local-worker

      - name: Build API container
        run: docker build -f api-server/Dockerfile .

      - name: Build Web container
        run: docker build ./client

      - name: Validate Compose deployment
        run: docker compose config --quiet

      - name: Validate production deployment script
        run: bash -n scripts/deploy-production.sh

      - name: Smoke test Compose deployment
        run: |
          set -euo pipefail
          cleanup() {
            status=$?
            trap - EXIT
            if [[ ${status} -ne 0 ]]; then
              docker compose logs --tail=100 api web
            fi
            docker compose down -v
            exit "${status}"
          }
          trap cleanup EXIT
          docker compose up -d --build api web
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8000/health/ready >/dev/null &&
               curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5173/ >/dev/null &&
               curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5173/health/ready | grep -q '"status":"ready"' &&
               curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5173/api/v1/auth/status | grep -q '"identity_mode"'; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Upload wheels
        uses: actions/upload-artifact@v5
        with:
          name: threadforge-python-wheels
          path: |
            pico-legacy-runtime/dist/*.whl
            agent-orchestrator/dist/*.whl
            api-server/dist/*.whl
            local-worker/dist/*.whl
