name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-runtime:
    name: Legacy runtime (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pico-legacy-runtime/pyproject.toml
            agent-orchestrator/pyproject.toml

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./pico-legacy-runtime
          python -m pip install -e ./agent-orchestrator
          python -m pip install pytest

      - name: Check dependencies
        run: python -m pip check

      - name: Run tests
        working-directory: pico-legacy-runtime
        run: python -m pytest -q

  build:
    name: Build Python packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: legacy-runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build legacy runtime
        run: python -m build --wheel ./pico-legacy-runtime

      - name: Build agent orchestrator
        run: python -m build --wheel ./agent-orchestrator

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: threadforge-python-wheels
          path: |
            pico-legacy-runtime/dist/*.whl
            agent-orchestrator/dist/*.whl
