name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "bootstrap/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-version:
    name: Worker version gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require a version bump for shipped Worker changes
        run: python scripts/check-worker-version.py

  tests:
    name: Tests (LangGraph + Security)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pico-legacy-runtime/pyproject.toml
            agent-orchestrator/pyproject.toml

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./pico-legacy-runtime
          python -m pip install -e ./agent-orchestrator
          python -m pip install pytest

      - name: Run LangGraph orchestration suite
        working-directory: pico-legacy-runtime
        run: python -m pytest -q tests/test_langgraph_backend.py tests/test_langgraph_intent.py tests/test_langgraph_planning_v11.py

      - name: Run security and safety invariants
        working-directory: pico-legacy-runtime
        run: python -m pytest -q tests/test_security.py tests/test_safety_invariants.py

  legacy-runtime:
    name: Legacy runtime (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pico-legacy-runtime/pyproject.toml
            agent-orchestrator/pyproject.toml

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./pico-legacy-runtime
          python -m pip install -e ./agent-orchestrator
          python -m pip install pytest

      - name: Check dependencies
        run: python -m pip check

      - name: Run tests
        working-directory: pico-legacy-runtime
        run: python -m pytest -q

  api-server:
    name: API server (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pico-legacy-runtime/pyproject.toml
            agent-orchestrator/pyproject.toml
            sandbox-workers/pyproject.toml
            api-server/pyproject.toml

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./pico-legacy-runtime
          python -m pip install -e ./agent-orchestrator
          python -m pip install -e ./sandbox-workers
          python -m pip install -e "./api-server[dev]"

      - name: Lint
        working-directory: api-server
        run: python -m ruff check src tests

      - name: Test
        working-directory: api-server
        run: python -m pytest -q

      - name: Build wheel
        run: python -m build --wheel ./api-server

  local-worker:
    name: Local Worker (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pico-legacy-runtime/pyproject.toml
            agent-orchestrator/pyproject.toml
            sandbox-workers/pyproject.toml
            local-worker/pyproject.toml

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./pico-legacy-runtime
          python -m pip install -e ./agent-orchestrator
          python -m pip install -e ./sandbox-workers
          python -m pip install -e "./local-worker[dev]"

      - name: Check dependencies
        run: python -m pip check

      - name: Lint
        working-directory: local-worker
        run: python -m ruff check src tests

      - name: Test
        working-directory: local-worker
        run: python -m pytest -q

      - name: Build wheel
        run: python -m build --wheel ./local-worker

  worker-installer:
    name: Windows Worker installer smoke test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pico-legacy-runtime/pyproject.toml
            agent-orchestrator/pyproject.toml
            sandbox-workers/pyproject.toml
            local-worker/pyproject.toml

      - name: Install Worker and build tooling
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -e ./pico-legacy-runtime -e ./agent-orchestrator -e ./sandbox-workers -e ./local-worker
          choco install nsis --no-progress -y

      - name: Build self-contained installer
        shell: pwsh
        run: ./scripts/build-worker-installer.ps1 -Version "0.0.0"

      - name: Install and execute final artifact
        shell: pwsh
        run: |
          $installer = (Resolve-Path "threadforge-worker-windows-x86_64.exe").Path
          $process = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          # A second silent install exercises the real upgrade path: stop the
          # service, run the installed uninstaller, replace files, then restart.
          $upgrade = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "Upgrade exited with $($upgrade.ExitCode)" }
          $worker = Join-Path $env:LOCALAPPDATA "ThreadForge\WorkerApp\threadforge-worker.exe"
          $service = Join-Path $env:LOCALAPPDATA "ThreadForge\WorkerApp\threadforge-worker-service.exe"
          if (-not (Test-Path -LiteralPath $worker)) { throw "Worker executable was not installed" }
          if (-not (Test-Path -LiteralPath $service)) { throw "Worker service executable was not installed" }
          & $worker --help
          if ($LASTEXITCODE -ne 0) { throw "Installed Worker CLI failed" }
          & $worker status
          if ($LASTEXITCODE -ne 0) { throw "Installed Worker status failed" }
          $serviceProcess = Start-Process -FilePath $service -ArgumentList "service" -PassThru
          if (-not $serviceProcess.WaitForExit(10000)) {
            Stop-Process -Id $serviceProcess.Id -Force
            throw "Unpaired Worker service did not exit"
          }
          if ($serviceProcess.ExitCode -ne 0) { throw "Unpaired Worker service failed" }

  client:
    name: Client (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: client
        run: pnpm typecheck

      - name: Lint
        working-directory: client
        run: pnpm lint

      - name: Test
        working-directory: client
        run: pnpm test

      - name: Build
        working-directory: client
        run: pnpm build

  build:
    name: Build Python packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [worker-version, legacy-runtime, api-server, local-worker, client]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build legacy runtime
        run: python -m build --wheel ./pico-legacy-runtime

      - name: Build agent orchestrator
        run: python -m build --wheel ./agent-orchestrator

      - name: Build sandbox workers
        run: python -m build --wheel ./sandbox-workers

      - name: Build API server
        run: python -m build --wheel ./api-server

      - name: Build local Worker
        run: python -m build --wheel ./local-worker

      - name: Build API container
        run: docker build -f api-server/Dockerfile .

      - name: Build Web container
        run: docker build ./client

      - name: Validate Compose deployment
        run: |
          docker compose config --quiet
          THREADFORGE_PUBLIC_HOST=threadforge.example.com \
            docker compose --profile public -f compose.yaml -f compose.public.yaml config --quiet

      - name: Validate Caddy public gateway
        run: |
          docker run --rm \
            -e THREADFORGE_PUBLIC_HOST=threadforge.example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Validate production scripts
        run: bash -n scripts/deploy-production.sh scripts/threadforge-ci-dispatch.sh scripts/publish-worker-release.sh

      - name: Smoke test private Worker release publisher
        run: |
          set -euo pipefail
          release_root="$(mktemp -d)"
          payload_root="$(mktemp -d)"
          trap 'rm -rf -- "${release_root}" "${payload_root}"' EXIT
          printf 'test-worker-binary' >"${payload_root}/threadforge-worker-windows-x86_64.exe"
          python - "${payload_root}" <<'PY'
          import hashlib
          import json
          import sys
          import zipfile
          from pathlib import Path

          root = Path(sys.argv[1])
          installer = root / "threadforge-worker-windows-x86_64.exe"
          manifest = {
              "schema_version": 1,
              "channel": "stable",
              "version": "1.2.3",
              "protocol_version": 1,
              "minimum_server_protocol": 1,
              "published_at": "2026-08-05T00:00:00Z",
              "platforms": {
                  "windows-x86_64": {
                      "filename": installer.name,
                      "size": installer.stat().st_size,
                      "sha256": hashlib.sha256(installer.read_bytes()).hexdigest(),
                  }
              },
              "signature": {"algorithm": "ed25519", "value": "test-signature"},
          }
          manifest_path = root / "worker-manifest.json"
          manifest_path.write_text(json.dumps(manifest), encoding="utf-8")
          with zipfile.ZipFile(root / "payload.zip", "w") as archive:
              archive.write(installer, installer.name)
              archive.write(manifest_path, manifest_path.name)
          PY
          base64 -w 0 "${payload_root}/payload.zip" | \
            THREADFORGE_WORKER_RELEASE_DIR="${release_root}" \
            bash scripts/publish-worker-release.sh worker-v1.2.3
          test -s "${release_root}/worker-manifest.json"
          test -s "${release_root}/1.2.3/threadforge-worker-windows-x86_64.exe"

      - name: Validate Worker release builder
        run: python scripts/build-worker-release.py --help

      - name: Smoke test Compose deployment
        run: |
          set -euo pipefail
          cleanup() {
            status=$?
            trap - EXIT
            if [[ ${status} -ne 0 ]]; then
              docker compose logs --tail=100 api web
            fi
            docker compose down -v
            exit "${status}"
          }
          trap cleanup EXIT
          docker compose up -d --build api web
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8000/health/ready >/dev/null &&
               curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5173/ >/dev/null &&
               curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5173/health/ready | grep -q '"status":"ready"' &&
               curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5173/api/v1/auth/status | grep -q '"identity_mode"'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
