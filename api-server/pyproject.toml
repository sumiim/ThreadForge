[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threadforge-api"
version = "0.1.0"
description = "ThreadForge FastAPI backend (REST + SSE) over the Pico Legacy Runtime"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
  "pydantic-settings>=2.2,<3.0",
  "anyio>=4.0,<5.0",
  "filelock>=3.13,<4.0",
  "cryptography>=43,<46",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx2>=2.0,<3.0",
  "ruff>=0.4",
  "build>=1.0",
]

[project.scripts]
threadforge-api = "threadforge_api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# B008: FastAPI Depends() defaults is idiomatic.
# BLE001: fail-closed cleanup, reconciliation, and shutdown paths per the
#   execution doc — these deliberately swallow non-fatal exceptions.
# S101: assert is the pytest standard assertion mechanism.
# S110/S112: same justification as BLE001.
# B017: pytest.raises(Exception) (line-level) is a known trade-off in tests.
ignore = ["B008", "BLE001", "B017", "S101", "S110", "S112", "UP031"]

# Note: the `pico` package must be installed first (editable):
#   python -m pip install -e ./pico-legacy-runtime
