[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threadforge-agent-orchestrator"
version = "0.1.0"
description = "LangGraph orchestration backend for ThreadForge"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=1.2,<1.3",
]

[tool.setuptools.packages.find]
where = ["src"]
